name: Azure Static Web Apps CI/CD

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Validate frontend
        run: npm run check
      - name: Audit frontend dependencies
        run: npm audit --audit-level=high
      - name: Install API dependencies
        working-directory: api
        run: npm ci
      - name: Validate API
        working-directory: api
        run: npm run check
      - name: Audit API dependencies
        working-directory: api
        run: npm audit --audit-level=high
      - name: Verify migration naming
        shell: bash
        run: |
          test -n "$(find migrations -maxdepth 1 -type f -name '[0-9][0-9][0-9]_*.sql' -print -quit)"

  build_and_deploy_job:
    if: github.event_name == 'push'
    needs: [validate, migrate_database]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - name: Build and deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WHITE_SKY_07B80490F }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: /
          api_location: api
          output_location: dist

  migrate_database:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - name: Build ordered migration bundle
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/rifw-migrations.sql"
          : > "$bundle"
          for migration in $(find migrations -maxdepth 1 -type f -name '[0-9][0-9][0-9]_*.sql' | sort); do
            printf '\n-- %s\n' "$migration" >> "$bundle"
            cat "$migration" >> "$bundle"
            printf '\n' >> "$bundle"
          done
          test -s "$bundle"
          echo "MIGRATION_BUNDLE=$bundle" >> "$GITHUB_ENV"
      - name: Apply database migrations
        id: migrate_attempt_1
        continue-on-error: true
        uses: azure/sql-action@v2.3
        with:
          connection-string: ${{ secrets.AZURE_SQL_CONNECTION_STRING }}
          path: ${{ env.MIGRATION_BUNDLE }}
      - name: Wait for Azure SQL to resume
        if: steps.migrate_attempt_1.outcome == 'failure'
        run: sleep 30
      - name: Retry database migrations
        id: migrate_attempt_2
        if: steps.migrate_attempt_1.outcome == 'failure'
        continue-on-error: true
        uses: azure/sql-action@v2.3
        with:
          connection-string: ${{ secrets.AZURE_SQL_CONNECTION_STRING }}
          path: ${{ env.MIGRATION_BUNDLE }}
      - name: Wait before final migration attempt
        if: steps.migrate_attempt_2.outcome == 'failure'
        run: sleep 60
      - name: Final database migration attempt
        id: migrate_attempt_3
        if: steps.migrate_attempt_2.outcome == 'failure'
        uses: azure/sql-action@v2.3
        with:
          connection-string: ${{ secrets.AZURE_SQL_CONNECTION_STRING }}
          path: ${{ env.MIGRATION_BUNDLE }}

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Close pull request environment
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WHITE_SKY_07B80490F }}
          action: close
